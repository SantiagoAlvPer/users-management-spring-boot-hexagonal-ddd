# =============================================
# Configuracion de Pruebas - Notifiers
# =============================================
spring.main.web-application-type=none

# Kafka test
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notifiers-test-group
spring.kafka.consumer.auto-offset-reset=earliest
kafka.topic.user-notifications=test-user-notifications

# Brevo test
brevo.base-url=https://api.brevo.test
brevo.api-key=xkeysib-test-api-key-12345
brevo.from.address=test@example.com
brevo.from.name=Test Notifier
brevo.timeout.connect=100ms
brevo.timeout.read=100ms
brevo.retry.max-attempts=3
brevo.retry.initial-delay=1ms
brevo.retry.multiplier=2.0
brevo.circuit-breaker.failure-rate-threshold=50
brevo.circuit-breaker.sliding-window-size=10
brevo.circuit-breaker.minimum-calls=5
brevo.circuit-breaker.open-duration=30s
