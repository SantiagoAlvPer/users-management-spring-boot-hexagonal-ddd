# =============================================
# Notification microservice (Kafka consumer + Brevo)
# =============================================
spring.application.name=notifications-service
server.port=${PORT:8080}

# Solo expone health para el despliegue
management.endpoints.web.exposure.include=health

# =============================================
# Kafka
# =============================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:notifications-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

notifications.kafka.topic.user-created=${KAFKA_TOPIC_USER_CREATED:user.created}

# Reintentos (backoff exponencial) antes de enviar el evento al DLT
notifications.retry.max-attempts=${NOTIFICATIONS_RETRY_MAX_ATTEMPTS:4}
notifications.retry.initial-interval-ms=${NOTIFICATIONS_RETRY_INITIAL_MS:1000}
notifications.retry.multiplier=${NOTIFICATIONS_RETRY_MULTIPLIER:2.0}
notifications.retry.max-interval-ms=${NOTIFICATIONS_RETRY_MAX_MS:10000}

# =============================================
# Brevo (API REST). El sender debe estar verificado en Brevo
# (p.ej. la cuenta Gmail desde la que se envia).
# =============================================
brevo.api-url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:tu_correo@gmail.com}
brevo.sender-name=${BREVO_SENDER_NAME:Gestion de Usuarios}
brevo.connect-timeout-ms=${BREVO_CONNECT_TIMEOUT_MS:5000}
brevo.read-timeout-ms=${BREVO_READ_TIMEOUT_MS:10000}
