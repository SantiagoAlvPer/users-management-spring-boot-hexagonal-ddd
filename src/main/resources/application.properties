# =============================================
# Accounts microservice (REST + PostgreSQL + Kafka producer)
# =============================================
spring.application.name=accounts-service
server.port=${PORT:8080}

# Solo expone health para el despliegue
management.endpoints.web.exposure.include=health

# =============================================
# Base de datos (PostgreSQL) — JDBC puro, sin JPA
# En Render usar los datos "Internal" de la base Postgres (sslmode=prefer)
# =============================================
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:5432}
db.name=${DB_NAME:wallet}
db.username=${DB_USERNAME:postgres}
db.password=${DB_PASSWORD:postgres}
db.ssl-mode=${DB_SSL_MODE:prefer}

# Crea la tabla accounts al arrancar (CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=${DB_INIT_MODE:always}
spring.sql.init.continue-on-error=false

# =============================================
# Kafka (productor). Para Aiven activar el perfil "aiven"
# (SPRING_PROFILES_ACTIVE=aiven) — ver application-aiven.properties
# =============================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
# Si Kafka no responde, no bloquear la peticion HTTP mas de 5 s
spring.kafka.producer.properties.max.block.ms=${KAFKA_MAX_BLOCK_MS:5000}

accounts.kafka.topic.account-created=${KAFKA_TOPIC_ACCOUNT_CREATED:account.created}

# =============================================
# Servicio de Users: GET /api/users/{id} para leer el correo del usuario
# Si Users protege el GET con JWT (rol ADMIN o REVIEWER), configurar una cuenta
# de servicio en USERS_SERVICE_EMAIL / USERS_SERVICE_PASSWORD
# =============================================
users.api.base-url=${USERS_SERVICE_URL:http://localhost:8081}
users.api.get-user-path=/api/users/{id}
users.api.login-path=${USERS_LOGIN_PATH:/api/auth/login}
users.api.email=${USERS_SERVICE_EMAIL:}
users.api.password=${USERS_SERVICE_PASSWORD:}
users.api.connect-timeout-ms=${USERS_CONNECT_TIMEOUT_MS:10000}
users.api.read-timeout-ms=${USERS_READ_TIMEOUT_MS:70000}
