# =============================================
# Spring Boot
# =============================================
spring.application.name=users-management
server.port=${PORT:8080}

# DataSource y JavaMail se configuran manualmente con @Configuration
# Se excluye la auto-configuracion para evitar conflicto con las claves db.* y smtp.*
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
spring.autoconfigure.exclude[2]=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# =============================================
# Configuracion de Base de Datos PostgreSQL
# =============================================
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:5432}
db.name=${DB_NAME:crud_usuarios}
db.username=${DB_USERNAME:postgres}
db.password=${DB_PASSWORD:postgres}
db.ssl-mode=${DB_SSL_MODE:disable}

# =============================================
# Configuracion SMTP (JavaMail)
# =============================================
smtp.host=${SMTP_HOST:smtp-relay.brevo.com}
smtp.port=${SMTP_PORT:587}
smtp.username=${SMTP_USERNAME:}
smtp.password=${SMTP_PASSWORD:}
smtp.from.address=${SMTP_FROM_ADDRESS:}
smtp.from.name=${SMTP_FROM_NAME:Gestion de Usuarios}

# =============================================
# Seguridad JWT
# En produccion defina JWT_SECRET con al menos 32 bytes aleatorios codificados en Base64.
# =============================================
jwt.secret=${JWT_SECRET:ZGV2ZWxvcG1lbnQtb25seS1qd3Qtc2VjcmV0LW11c3QtYmUtcmVwbGFjZWQ=}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}

# =============================================
# Kafka (productor de eventos de usuario)
# El servicio de notificaciones consume estos topics.
# max.block.ms bajo: si Kafka cae, crear usuario no se queda esperando.
# =============================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Aiven: KAFKA_SECURITY_PROTOCOL=SASL_SSL + usuario/clave SASL. Local: PLAINTEXT (sin seguridad).
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:}" password="${KAFKA_PASSWORD:}";
# CA de Aiven en formato PEM (contenido completo de ca.pem). Solo se usa con SSL.
spring.kafka.properties.ssl.truststore.type=${KAFKA_SSL_TRUSTSTORE_TYPE:PEM}
spring.kafka.properties.ssl.truststore.certificates=${KAFKA_SSL_CA_PEM:}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=${KAFKA_MAX_BLOCK_MS:3000}
spring.kafka.producer.properties.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:10000}
spring.kafka.producer.properties.request.timeout.ms=5000
events.kafka.topic-prefix=${KAFKA_TOPIC_PREFIX:}
