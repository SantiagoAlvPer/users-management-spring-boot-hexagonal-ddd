# =============================================
# Perfil "aiven": Kafka en Aiven con SASL/SCRAM sobre SSL
# Requiere en Aiven: Advanced configuration -> kafka_authentication_methods.sasl = true
# Usar el host:puerto de la pestana "SASL" del servicio (no el de "Client certificate").
# =============================================
spring.kafka.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";
# Contenido del ca.pem de Aiven (pegar el PEM completo en la variable de entorno)
spring.kafka.ssl.trust-store-type=PEM
spring.kafka.ssl.trust-store-certificates=${KAFKA_CA_CERT}
