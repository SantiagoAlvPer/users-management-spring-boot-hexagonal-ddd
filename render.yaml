databases:
  - name: users-management-db
    plan: free
    databaseName: crud_usuarios
    user: users_management

services:
  - type: web
    name: users-management
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: users-management-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: users-management-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: users-management-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: users-management-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: users-management-db
          property: password
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_SECONDS
        value: "900"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_ADDRESS
        sync: false
      - key: SMTP_FROM_NAME
        value: Gestion de Usuarios
