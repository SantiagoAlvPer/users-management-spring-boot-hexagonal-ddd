services:
  - type: web
    name: notifications-service
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_GROUP_ID
        value: notifications-service
      - key: KAFKA_TOPIC_USER_CREATED
        value: user.created
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Gestion de Usuarios
