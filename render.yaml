services:
  - type: web
    name: notifiers
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "8080"
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_TOPIC_USER_NOTIFICATIONS
        value: "user-notifications"
      - key: KAFKA_CONSUMER_GROUP_ID
        value: "notifiers-group"
      - key: KAFKA_SECURITY_PROTOCOL
        value: "PLAINTEXT"
      - key: KAFKA_SASL_MECHANISM
        sync: false
      - key: KAFKA_SASL_JAAS_CONFIG
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_ADDRESS
        sync: false
      - key: BREVO_FROM_NAME
        value: "Notificaciones"
